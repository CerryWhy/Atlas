[project]
name = "atlas"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "trimesh",
  "numpy",
  "scipy",
  "sqlite-vec",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]
# Embedding locali (07 e ricerca dell'API). Su GPU NVIDIA installare prima torch con CUDA
# seguendo https://pytorch.org/get-started/locally/, poi questo gruppo.
embed = ["sentence-transformers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["api*", "pipeline*"]
